<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Habit Tracker ✅❌</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <nav class="navbar">
    <img src="assets/logo.png" alt="Habit Tracker Logo" class="logo">
    <div class="nav-menu">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </div>
      <div class="nav-buttons" id="nav-buttons">
        <!-- Buttons will be populated by JavaScript -->
      </div>
    </div>
    <button class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
  <div class="month-header" id="monthHeader"></div>
  <div class="controls">
    <button onclick="changeMonth(-1)">⬅ Previous</button>
    <button onclick="changeMonth(1)">Next ➡</button>
    <button onclick="addHabit()">+ Add Habit</button>
  </div>

  <div class="legend">
    <span class="done">✅ Done</span>
    <span class="missed">❌ Missed</span>
    <span class="empty">Not marked</span>
  </div>

  <div class="sheet">
    <table id="habitTable"></table>
  </div>

  <div class="charts-section">
    <h3>Monthly Progress</h3>
    <canvas id="progressChart"></canvas>
  </div>

  <div class="achievements-section">
    <h3>Achievements</h3>
    <div id="achievements"></div>
  </div>

  <div class="controls">
    <button onclick="toggleView()">Toggle Calendar View</button>
    <button onclick="shareProgress()">Share Progress</button>
  </div>

  <div id="calendarView" style="display: none;">
    <h3>Calendar View</h3>
    <div id="calendar"></div>
  </div>

  <p class="note">Click a cell to cycle: Not marked → ✅ Done → ❌ Missed → Not marked. Data saved in MongoDB Atlas.</p>
  <script type="module" src="src/script.js"></script>

</body>

</html>
